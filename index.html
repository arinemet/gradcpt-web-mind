<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gradcpt-web-mind</title>
    <!-- 1) Import jQuery from Google CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
    <!-- 2) Import HeadphoneCheck.js (minified) from McDermott S3 server -->
    <script
      type="text/javascript"
      src="https://s3.amazonaws.com/mcd-headphone-check/v1.0/src/HeadphoneCheck.min.js"
    ></script>
    <!-- 2) Import HeadphoneCheck.css from McDermott S3 server -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://s3.amazonaws.com/mcd-headphone-check/v1.0/src/HeadphoneCheckStyle.css"
    />

    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100svh;
      }

      #start-screen,
      .message {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
        cursor: pointer;
      }

      #app {
        text-align: center;
      }

      #rtime {
        min-height: 1.5rem;
        margin-top: 12px;
        font-size: 18px;
      }

      .consent-box {
        max-width: 800px;
        max-height: 2000px;
        overflow-y: auto;
        margin: 24px auto;
        padding: 24px;
        border: 1px solid #aaa;
        background: #fff;
        color: #222;
        text-align: left;
        white-space: pre-line;
      }

      body:has(.consent-box) {
        align-items: flex-start;
        justify-content: flex-start;
        overflow-y: auto;
      }

      body:has(.consent-box) .jspsych-content-wrapper {
        align-items: flex-start;
        margin: 0 auto;
      }

      body:has(.consent-box) .jspsych-content {
        margin: 0 auto;
      }

      #song-choices {
        width: 100%;
        margin: 1.5rem 0;
        border-collapse: collapse;
        text-align: left;
      }

      body:has(#song-choices) {
        align-items: flex-start;
        justify-content: flex-start;
        overflow-y: auto;
      }

      body:has(#song-choices) .jspsych-content-wrapper {
        align-items: flex-start;
        margin: 0 auto;
      }

      body:has(#song-choices) .jspsych-content {
        margin: 0 auto;
      }

      body:has(#song-choices) .audio-setup {
        padding: 2rem 1rem;
      }

      #song-choices th,
      #song-choices td {
        padding: 0.75rem 1rem;
        border: 0;
        border-bottom: 1px solid #aaa;
      }

      #song-choices th:first-child,
      #song-choices td:first-child,
      #song-choices th:last-child,
      #song-choices td:last-child {
        width: 5rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="loading-message"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
